name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.176.1

      - name: Semgrep static analysis
        run: >-
          semgrep scan
          --config p/default
          --config p/nodejs
          --config p/javascript
          --config p/security-audit
          --config p/secrets
          --exclude node_modules
          --exclude package-lock.json
          --metrics=off
          --error
          .
