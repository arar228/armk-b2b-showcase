name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42b2306e649f5f27b4c5e1285e610bc1f55e

      - name: Set up Node.js
        uses: actions/setup-node@820762aa8692fdc644acf6cab46e0b48e2416e19
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install Semgrep
        run: python -m pip install semgrep==1.176.1

      - name: Semgrep static analysis
        run: semgrep --config p/default --config p/nodejs --config p/javascript --config p/security-audit --config p/secrets --metrics=off --error .
